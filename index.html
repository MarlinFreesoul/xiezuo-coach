<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>写作教练 · 《写作技法荟萃》131 技法</title>
<meta name="description" content="以《写作技法荟萃》131 种通用写作技法为底座的写作教练：诊断—选招—改写—验收" />
<style>
  :root { --bg:#faf8f5; --fg:#1f1d1a; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  #app { height:100dvh; display:flex; flex-direction:column; }
  header.top { padding:14px 18px 10px; border-bottom:1px solid rgba(0,0,0,.06); background:rgba(250,248,245,.92);
    backdrop-filter:saturate(1.4) blur(10px); position:sticky; top:0; z-index:5; }
  header.top h1 { margin:0; font-size:16px; font-weight:600; letter-spacing:.2px; }
  header.top p { margin:4px 0 0; font-size:12px; color:#7a746c; }
  #chat-wrap { flex:1; min-height:0; position:relative; }
  praxis-agent { display:block; width:100%; height:100%; }
  #chat-status { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:13px; color:#8a8379; text-align:center; padding:0 24px; }
  #chat-status:empty { display:none; }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <h1>写作教练</h1>
    <p>以《写作技法荟萃》131 种通用技法为底座 · 诊断 → 选招 → 改写 → 验收</p>
  </header>
  <div id="chat-wrap">
    <praxis-agent></praxis-agent>
    <p id="chat-status">正在连接…</p>
  </div>
</div>

<script type="module">
import { configure } from "https://cdn.deepraxis.com/v1/praxis-session.js";

const API = "https://api.deepraxis.com";
const PUBLISHABLE_KEY = "cpk_bpvbNo2UTqZ6OcL1Tbywnnx8kkFirmsOCzSzwWzYgI8";
const AGENT_ID = "agent_022ea5eb-6836-40d5-bd47-233afea46995";

const status = document.querySelector("#chat-status");
const OPTIONS = {
  agent: { id: AGENT_ID, name: "写作教练" },
  layout: "inline",
  header: { title: "写作教练", subtitle: "《写作技法荟萃》131 技法 · 改稿先诊断" },
  composer: { placeholder: "贴一段你写不动的文字，说一句症状，例如「读者说像流水账」" },
  theme: { accent: "#b4552d", radius: "14px" },
  footer: { text: "来源：李志义、邢维《写作技法荟萃》1990" }
};

try {
  configure({ api: { url: API, publishableKey: PUBLISHABLE_KEY } });
  await import("https://cdn.deepraxis.com/v1/praxis-kit.js");
  await customElements.whenDefined("praxis-agent");
  const el = document.querySelector("praxis-agent");
  el.setOptions(OPTIONS);
  status.textContent = "";
  el.addEventListener("praxis.session.end", () => {
    configure({ api: { url: API, publishableKey: PUBLISHABLE_KEY } });
  });
  el.addEventListener("praxis.error", (e) => {
    status.textContent = "对话暂时不可用（" + (e?.detail?.code || "unknown") + "）。请刷新重试。";
  });
} catch (err) {
  status.textContent = "加载失败：" + (err && err.message ? err.message : err);
}
</script>
</body>
</html>
